events {
    worker_connections 1024;
}

http {
    # Las 4 replicas del servicio "backend".
    # Docker resuelve el nombre "backend" a la IP de cada replica.
    upstream backend_api {
        server backend:8000 max_fails=0;
    }

    server {
        listen 80;

        # Permite subir fotos de perfil (la API acepta hasta 5 MB)
        client_max_body_size 6m;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Si una replica falla, intentar con otra
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
