services:
  - type: web
    name: smartcompost-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: IOT_API_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: smartcompost
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_SSL
        value: "true"
