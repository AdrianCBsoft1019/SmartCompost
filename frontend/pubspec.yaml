publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0
  image_picker: ^1.1.2

  # Generación y descarga de reportes PDF
  pdf: ^3.10.4
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  image: 4.3.0
  archive: 3.6.1
