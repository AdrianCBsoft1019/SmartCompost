version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: smartcompost_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-smartcompost}
    ports:
      - "3306:3306"
    volumes:
      - smartcompost_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: smartcompost_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smartcompost}
      DB_USER: root
      DB_PASSWORD: ""
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  smartcompost_db_data: